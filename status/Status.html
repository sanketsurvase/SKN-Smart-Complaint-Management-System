<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Check Complaint Status</title>


    <!-- ==========================================
         CSS
    =========================================== -->

    <link rel="stylesheet"
          href="./Status.css">


    <!-- ==========================================
         GOOGLE FONT
    =========================================== -->

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
          rel="stylesheet">


    <!-- ==========================================
         FONT AWESOME
    =========================================== -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header class="header">

    <div class="college">

        <img
            src="../Images/skn logo.png"
            alt="College Logo">

        <div>

            <h2>
                SKN Sinhgad College of Engineering, Pandharpur
            </h2>

            <p>
                Smart Complaint Management System
            </p>

        </div>

    </div>

</header>


<!-- ==========================================
     PAGE TITLE
========================================== -->

<section class="page-title">

    <h1>
        Check Complaint Status
    </h1>

    <p>
        Enter your Tracking ID to check the current complaint status.
    </p>

</section>


<!-- ==========================================
     MAIN
========================================== -->

<main class="container">


    <!-- ======================================
         STATUS BOX
    ======================================= -->

    <div class="status-box">


        <!-- ==================================
             SEARCH BOX
        =================================== -->

        <div class="search-box">

            <label for="trackingId">
                Tracking ID
            </label>


            <div class="search-row">

                <input
                    type="text"
                    id="trackingId"
                    placeholder="Example: CMP2608230001"
                    autocomplete="off">


                <button
                    type="button"
                    id="checkStatusButton">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    Check Status

                </button>

            </div>

        </div>


        <!-- ==================================
             ERROR / MESSAGE
        =================================== -->

        <p
            id="statusMessage"
            class="message">
        </p>


        <!-- ==================================
             STATUS RESULT
             GENERATED BY Status.js
        =================================== -->

        <div
            id="complaintResult"
            class="complaint-result">
        </div>


    </div>


</main>


<!-- ==========================================
     FOOTER
========================================== -->

<footer>

    © 2026 Smart Complaint Management System |
    SKN Sinhgad College of Engineering, Pandharpur

</footer>


<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script
    type="module"
    src="./Status.js?v=3">
</script>


</body>

</html>
