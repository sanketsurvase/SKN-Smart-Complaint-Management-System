<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Complaints</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #222;
        }

        .back-btn {
            background: #1677ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .back-btn:hover {
            background: #095dcc;
        }


        /* COMPLAINT CARD */

        .complaint-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .complaint-card h2 {
            color: #1677ff;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .complaint-card p {
            margin: 10px 0;
            color: #444;
            font-size: 16px;
            line-height: 1.5;
        }

        .complaint-card strong {
            color: #222;
        }


        /* STATUS */

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-weight: bold;
        }


        /* NO COMPLAINT */

        .no-complaints {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            color: #777;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .no-complaints h2 {
            margin-bottom: 10px;
            color: #555;
        }


        /* DELETE BUTTON */

        .delete-btn {
            margin-top: 20px;
            background: #dc3545;
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b02a37;
        }


        /* RESPONSIVE */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .complaint-card {
                padding: 18px;
            }

        }

    </style>

</head>


<body>

    <div class="container">


        <!-- HEADER -->

        <div class="header">

            <h1>My Complaints</h1>

            <button
                type="button"
                class="back-btn"
                onclick="window.location.href='dashboard.html'">

                Back

            </button>

        </div>


        <!-- COMPLAINTS WILL BE DISPLAYED HERE -->

        <div id="complaintsList"></div>


    </div>


    <script>

        // =====================================
        // DISPLAY ALL COMPLAINTS
        // =====================================

        function displayComplaints() {

            const complaintsList =
                document.getElementById("complaintsList");


            // Get complaints from localStorage

            const complaints =
                JSON.parse(
                    localStorage.getItem("complaints")
                ) || [];


            // =====================================
            // NO COMPLAINTS
            // =====================================

            if (complaints.length === 0) {

                complaintsList.innerHTML = `

                    <div class="no-complaints">

                        <h2>No Complaints Submitted</h2>

                        <p>
                            You have not submitted any complaints yet.
                        </p>

                    </div>

                `;

                return;
            }


            // Clear old data

            complaintsList.innerHTML = "";


            // =====================================
            // DISPLAY EACH COMPLAINT
            // =====================================

            complaints.forEach(function (complaint, index) {


                const id =
                    complaint.id ||
                    "CMP" + (index + 1);


                const studentName =
                    complaint.studentName ||
                    "Not Available";


                const studentId =
                    complaint.studentId ||
                    "Not Available";


                const department =
                    complaint.department ||
                    "Not Available";


                const category =
                    complaint.category ||
                    "Not Available";


                const title =
                    complaint.title ||
                    "Not Available";


                const description =
                    complaint.description ||
                    "Not Available";


                const location =
                    complaint.location ||
                    "Not Available";


                const priority =
                    complaint.priority ||
                    "Not Available";


                const status =
                    complaint.status ||
                    "Pending";


                const date =
                    complaint.date ||
                    "Not Available";


                // =====================================
                // CREATE COMPLAINT CARD
                // =====================================

                const complaintCard =
                    document.createElement("div");


                complaintCard.className =
                    "complaint-card";


                complaintCard.innerHTML = `

                    <h2>
                        Complaint ID: ${id}
                    </h2>


                    <p>
                        <strong>Student Name:</strong>
                        ${studentName}
                    </p>


                    <p>
                        <strong>Student ID:</strong>
                        ${studentId}
                    </p>


                    <p>
                        <strong>Department:</strong>
                        ${department}
                    </p>


                    <p>
                        <strong>Category:</strong>
                        ${category}
                    </p>


                    <p>
                        <strong>Complaint Title:</strong>
                        ${title}
                    </p>


                    <p>
                        <strong>Description:</strong>
                        ${description}
                    </p>


                    <p>
                        <strong>Location:</strong>
                        ${location}
                    </p>


                    <p>
                        <strong>Priority:</strong>
                        ${priority}
                    </p>


                    <p>
                        <strong>Date:</strong>
                        ${date}
                    </p>


                    <p>
                        <strong>Status:</strong>

                        <span class="status">
                            ${status}
                        </span>

                    </p>


                    <button
                        type="button"
                        class="delete-btn"
                        onclick="deleteComplaint(${index})">

                        Delete Complaint

                    </button>

                `;


                complaintsList.appendChild(
                    complaintCard
                );

            });

        }


        // =====================================
        // DELETE COMPLAINT
        // =====================================

        function deleteComplaint(index) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this complaint?"
                );


            if (!confirmDelete) {
                return;
            }


            let complaints =
                JSON.parse(
                    localStorage.getItem("complaints")
                ) || [];


            complaints.splice(index, 1);


            localStorage.setItem(
                "complaints",
                JSON.stringify(complaints)
            );


            displayComplaints();

        }


        // =====================================
        // LOAD COMPLAINTS WHEN PAGE OPENS
        // =====================================

        displayComplaints();

    </script>

</body>

</html>
